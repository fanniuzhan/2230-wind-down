plugins {
    id 'com.android.application'
}
android {
    namespace 'com.fanniuzhan.winddown'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.fanniuzhan.winddown'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.1.3'
        testInstrumentationRunner 'com.fanniuzhan.winddown.ClockLaunchInstrumentation'
    }
    compileOptions {
        encoding 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
dependencies {
    implementation project(':core')
}
